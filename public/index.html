<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020403">
<title>Horde Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed arena canvas, thin HUD strip on top, overlay panels for menus. Single dark world by design. */
:root{
  --void:#020403; --floor:#080d0c; --wall:#161e1c; --ink:#d9dfdb; --muted:#6c7a76;
  --you:#f0a63a; --foe:#d3283a; --storm:#a8261d; --orb:#4fc9a4;
  --panel:#070b0a; --line:#121a18;
  --display:'Oxanium','Trebuchet MS',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--display);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--you);outline-offset:2px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;
  background:linear-gradient(var(--void),transparent)}
.side{display:flex;flex-direction:column;gap:4px;min-width:0}
.side.rt{align-items:flex-end;text-align:right}
.tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.you .tag b{color:var(--you)} .rt .tag b{color:var(--ink)}
.tag span{color:var(--muted);font-family:var(--mono);font-weight:500;letter-spacing:0}
.bar{width:100%;max-width:220px;height:8px;background:var(--line);border-radius:2px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .12s linear;background:var(--you)}
.bar.arm{height:5px;margin-bottom:2px;visibility:hidden}.bar.arm i{background:#8fb8d8}
.xp{height:3px;max-width:220px;width:100%;background:var(--line);border-radius:2px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--orb);width:0}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.alive{display:flex;align-items:baseline;gap:6px}
.alive b{font-family:var(--mono);font-size:24px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.alive span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
#stormTxt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--storm);white-space:nowrap;font-weight:700}
#pauseBtn{pointer-events:auto;background:none;border:1px solid var(--line);border-radius:4px;width:30px;height:24px;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.05em}

#dashBtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 6px);
  bottom:calc(env(safe-area-inset-bottom,0px) + min(42vh,230px));
  width:70px;height:70px;border-radius:50%;border:2px solid var(--you);background:rgba(255,181,71,.12);
  font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--you);touch-action:none;
  background-image:conic-gradient(rgba(6,9,11,.75) calc(var(--cd,0)*360deg),transparent 0)}
#dashBtn[hidden]{display:none!important}
#abBtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 88px);
  bottom:calc(env(safe-area-inset-bottom,0px) + min(42vh,230px));
  width:70px;height:70px;border-radius:50%;border:2px solid #b7a0ff;background:rgba(138,99,255,.14);
  font-weight:800;font-size:10px;letter-spacing:.08em;color:#c9b8ff;touch-action:none;
  background-image:conic-gradient(rgba(6,9,11,.75) calc(var(--cd,0)*360deg),transparent 0)}
#abBtn .cnt{display:block;font-size:22px;letter-spacing:0;line-height:1;margin-top:2px}
#abBtn[hidden]{display:none!important}
#bandBtn,#kitBtn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + min(42vh,230px) + 82px);width:62px;height:62px;border-radius:50%;border:2px solid #6be38a;background:rgba(107,227,138,.12);
  font-weight:800;font-size:8.5px;letter-spacing:.06em;color:#9af0b3;touch-action:none;background-image:conic-gradient(rgba(6,9,11,.75) calc(var(--cd,0)*360deg),transparent 0)}
#bandBtn{right:calc(max(16px,env(safe-area-inset-right,0px)) + 10px)}
#kitBtn{right:calc(max(16px,env(safe-area-inset-right,0px)) + 92px)}
#bandBtn .cnt,#kitBtn .cnt{display:block;font-size:19px;letter-spacing:0;line-height:1;margin-top:2px}
#bandBtn[hidden],#kitBtn[hidden]{display:none!important}
#bandBtn.off,#kitBtn.off{opacity:.4}
#abBtn.rdy{box-shadow:0 0 0 3px rgba(138,99,255,.25)}
#zmBtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 170px);bottom:calc(env(safe-area-inset-bottom,0px) + min(42vh,230px));width:62px;height:62px;border-radius:50%;border:2px solid #b7a0ff;background:rgba(138,99,255,.14);font-weight:800;font-size:10px;letter-spacing:.08em;color:#c9b8ff;touch-action:none}
#zmBtn[hidden]{display:none!important}
#useBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:20;padding:12px 22px;border-radius:12px;border:2px solid #3fe07a;background:rgba(10,30,18,.82);color:#9af0b3;font:800 13px var(--display);letter-spacing:.12em;touch-action:none;cursor:pointer;animation:needpulse 1.2s ease-in-out infinite}
#useBtn[data-t=UNLOCK]{border-color:#e8573f;color:#ffb3a6;background:rgba(40,12,8,.82)}
#useBtn[hidden]{display:none!important}
html[data-plat=pc] #useBtn::before{content:attr(data-key);margin-right:10px;padding:2px 7px;font:700 11px var(--mono);color:var(--ink);background:#0b100f;border:1px solid #2a3633;border-bottom-width:2px;border-radius:4px}
html[data-plat=phone] #useBtn{bottom:calc(var(--sb) + 190px*var(--k,1));padding:calc(14px*var(--k,1)) calc(24px*var(--k,1));font-size:calc(14px*var(--hs,1))}
#zmBtn.on{background:rgba(138,99,255,.5);box-shadow:0 0 0 3px rgba(138,99,255,.3)}
#zmBtn .cnt{display:block;font-size:15px;letter-spacing:0;line-height:1;margin-top:2px}
html[data-plat=pc] #zmBtn{top:auto;right:auto;left:calc(50% + 182px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:84px;height:62px;border-radius:9px;font-size:11px;cursor:pointer}
html[data-plat=pc] #zmBtn::before{content:attr(data-key);position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:2px 7px;font:700 10px var(--mono);color:var(--ink);background:#0b100f;border:1px solid #2a3633;border-bottom-width:2px;border-radius:5px;white-space:nowrap}

/* ===== Phone layout: fixed twin sticks, thumb-reach buttons, landscape gate ===== */
html[data-plat=phone]{--pl:max(20px,env(safe-area-inset-left,0px));--pr:max(20px,env(safe-area-inset-right,0px));--sb:calc(env(safe-area-inset-bottom,0px) + 16px)}
html[data-plat=phone] #dashBtn,html[data-plat=phone] #abBtn,html[data-plat=phone] #bandBtn,html[data-plat=phone] #kitBtn,html[data-plat=phone] #zmBtn{top:auto;border-width:3px;font-size:11px;letter-spacing:.06em;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;background-color:rgba(2,4,3,.55)}
html[data-plat=phone] #dashBtn[hidden],html[data-plat=phone] #abBtn[hidden],html[data-plat=phone] #bandBtn[hidden],html[data-plat=phone] #kitBtn[hidden],html[data-plat=phone] #zmBtn[hidden]{display:none!important}
html[data-plat=phone] #abBtn{width:calc(80px*var(--k,1));height:calc(80px*var(--k,1));right:calc(var(--pr) + 166px*var(--k,1));bottom:calc(var(--sb) + 22px*var(--k,1));font-size:calc(11px*var(--hs,1))}
html[data-plat=phone] #dashBtn{width:calc(68px*var(--k,1));height:calc(68px*var(--k,1));right:calc(var(--pr) + 172px*var(--k,1));bottom:calc(var(--sb) + 112px*var(--k,1))}
html[data-plat=phone] #zmBtn{width:calc(62px*var(--k,1));height:calc(62px*var(--k,1));right:calc(var(--pr) + 256px*var(--k,1));bottom:calc(var(--sb) + 30px*var(--k,1))}
html[data-plat=phone] #bandBtn{width:calc(74px*var(--k,1));height:calc(74px*var(--k,1));left:calc(var(--pl) + 166px*var(--k,1));bottom:calc(var(--sb) + 22px*var(--k,1));right:auto}
html[data-plat=phone] #kitBtn{width:calc(68px*var(--k,1));height:calc(68px*var(--k,1));left:calc(var(--pl) + 172px*var(--k,1));bottom:calc(var(--sb) + 112px*var(--k,1));right:auto}
html[data-plat=phone] #abBtn .cnt,html[data-plat=phone] #bandBtn .cnt,html[data-plat=phone] #kitBtn .cnt{font-size:24px;margin-top:3px}
html[data-plat=phone] #bandBtn,html[data-plat=phone] #kitBtn{font-size:10px}
html[data-plat=phone] #bandBtn.off,html[data-plat=phone] #kitBtn.off{opacity:.5}
html[data-plat=phone] #bandBtn.need,html[data-plat=phone] #kitBtn.need{animation:needpulse 1s ease-in-out infinite;background-color:rgba(40,120,70,.45)}
@keyframes needpulse{0%,100%{box-shadow:0 0 0 0 rgba(107,227,138,.0)}50%{box-shadow:0 0 0 7px rgba(107,227,138,.35)}}
html[data-plat=phone] #abBtn.rdy{box-shadow:0 0 0 4px rgba(138,99,255,.4),0 0 16px rgba(138,99,255,.45)}
#rot{position:fixed;inset:0;z-index:200;background:var(--void);display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#rot .rbox{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:320px}
#rot svg{width:96px;height:96px;animation:rotphone 2.4s ease-in-out infinite}
@keyframes rotphone{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
@media (orientation:portrait){html[data-plat=phone] #rot{display:flex}}

/* Overlay */
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(6,9,11,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px)}
#ov[hidden],#hud[hidden]{display:none!important}
#reelBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:10px;z-index:30;font:700 12px Oxanium,sans-serif;color:var(--muted)}
#reelBar[hidden]{display:none}
#reelBar button{font:700 13px Oxanium,sans-serif;color:var(--ink);background:rgba(20,28,32,.85);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
#panel.elim{background:#0b0d10;border-color:#a3202a;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 12px 40px rgba(0,0,0,.7)}
#panel{width:100%;max-width:520px;max-height:100%;overflow-y:auto;touch-action:pan-y;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 20px;
  display:flex;flex-direction:column;gap:16px}
.pfoot{position:sticky;bottom:0;z-index:2;display:flex;flex-direction:column;margin:0 -20px -22px;padding:10px 20px 22px;background:var(--panel)}
.pfoot::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:14px;background:linear-gradient(to top,var(--panel),transparent);pointer-events:none}
.eyebrow{margin:0;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--storm)}
h1{margin:0;font-size:clamp(40px,11vw,60px);line-height:.9;font-weight:800;letter-spacing:-.02em;text-wrap:balance;text-transform:uppercase}
h1 em{font-style:normal;color:var(--you)}
h2{margin:0;font-size:28px;font-weight:800;text-transform:uppercase;line-height:1;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:44ch}
.group{display:flex;flex-direction:column;gap:8px}
.glabel{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;padding:10px 0;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.06em}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--foe);color:var(--void)}
.weps,.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cards{grid-template-columns:1fr}
.wep,.card{text-align:left;background:transparent;border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wep[aria-pressed="true"]{border-color:var(--you);background:rgba(255,181,71,.08)}
.wname,.cname{font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.wep[aria-pressed="true"] .wname{color:var(--you)}
.wblurb,.cdesc{font-size:12.5px;color:var(--muted);line-height:1.35}
.wstat,.ccount{font-family:var(--mono);font-size:11px;color:var(--ink);opacity:.8;font-variant-numeric:tabular-nums}
.card{flex-direction:row;align-items:center;gap:12px}
.card .cbody{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.card:active,.wep:active{transform:scale(.98)}
.card .cname{color:var(--orb)}
.card.rare .cname{color:var(--storm)}
.card.gun{border-color:rgba(255,181,71,.5);background:rgba(255,181,71,.06)}
.card.gun .cname{color:var(--you)}
.card.abil{border-color:rgba(183,160,255,.6);background:rgba(138,99,255,.09)}
.card.abil .cname,.card.abil .ctag{color:#c9b8ff}
.wrole{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wab{font-size:12px;line-height:1.35;color:#c9b8ff}
.wep[aria-pressed="true"] .wrole{color:var(--you)}
.ctag{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--you);opacity:.85}
.go{background:var(--you);color:var(--void);border:0;border-radius:4px;padding:14px;font-weight:800;font-size:16px;letter-spacing:.12em;text-transform:uppercase}
.go.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.how{font-size:13px;color:var(--muted);line-height:1.5}
.how summary{cursor:pointer;font-weight:700;color:var(--ink);letter-spacing:.06em}
.how ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.build{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.6}
.build b{color:var(--ink);font-weight:600}
.tbl{display:flex;flex-direction:column;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tr{display:grid;grid-template-columns:30px 1fr 44px 44px 44px;gap:6px;padding:7px 10px;align-items:center}
.tr+.tr{border-top:1px solid var(--line)}
.tr span:nth-child(n+3){text-align:right}
.tr.th{color:var(--muted);font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.tr.me{background:rgba(255,181,71,.1);color:var(--you)}
@media (orientation:landscape) and (max-height:500px){
  #panel{max-width:760px;padding:16px}
  .weps{grid-template-columns:repeat(3,1fr)}
  .cards{grid-template-columns:repeat(3,1fr)}
  .card{flex-direction:column;align-items:flex-start}
  h1{font-size:40px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
/* ===== PC / desktop layer ===== */
.pcOnly{display:none}
html[data-plat=pc] .pcOnly{display:list-item}
html[data-plat=pc] .phoneOnly{display:none}
#keys{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);display:none;gap:6px 14px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,980px);pointer-events:none;
  font:700 11px/1 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;opacity:.92;transition:opacity .4s}
#keys.on{display:flex}
#keys.fade{opacity:0}
#keys b{display:inline-block;min-width:20px;padding:4px 6px;margin-right:6px;text-align:center;color:var(--ink);background:rgba(8,13,12,.85);border:1px solid #2a3633;border-bottom-width:2px;border-radius:5px}
html[data-plat=pc] #hud{padding:14px 30px;gap:28px;background:linear-gradient(rgba(2,4,3,.75),transparent)}
html[data-plat=pc] .tag{font-size:13px}
html[data-plat=pc] .bar{max-width:340px;height:12px;border-radius:3px}
html[data-plat=pc] .bar.arm{height:7px}
html[data-plat=pc] .xp{max-width:340px;height:4px}
html[data-plat=pc] .alive b{font-size:34px}
html[data-plat=pc] .alive span,html[data-plat=pc] #stormTxt{font-size:12px}
html[data-plat=pc] #pauseBtn{width:38px;height:30px;font-size:12px}
html[data-plat=pc] #pauseBtn:hover{color:var(--ink);border-color:var(--muted)}
html[data-plat=pc] #dashBtn,html[data-plat=pc] #abBtn,html[data-plat=pc] #bandBtn,html[data-plat=pc] #kitBtn{
  top:auto;right:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:84px;height:62px;border-radius:9px;font-size:11px;letter-spacing:.08em;cursor:pointer;transition:transform .08s,filter .12s}
html[data-plat=pc] #bandBtn{left:calc(50% - 178px)}
html[data-plat=pc] #kitBtn{left:calc(50% - 88px)}
html[data-plat=pc] #dashBtn{left:calc(50% + 2px)}
html[data-plat=pc] #abBtn{left:calc(50% + 92px)}
html[data-plat=pc] #dashBtn:hover,html[data-plat=pc] #abBtn:hover,html[data-plat=pc] #bandBtn:hover,html[data-plat=pc] #kitBtn:hover{filter:brightness(1.25);transform:translateY(-2px)}
html[data-plat=pc] #dashBtn::before,html[data-plat=pc] #abBtn::before,html[data-plat=pc] #bandBtn::before,html[data-plat=pc] #kitBtn::before{
  content:attr(data-key);position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:2px 7px;font:700 10px var(--mono);letter-spacing:.04em;color:var(--ink);
  background:#0b100f;border:1px solid #2a3633;border-bottom-width:2px;border-radius:5px;white-space:nowrap}
html[data-plat=pc] #panel{max-width:760px;padding:30px 32px;gap:18px}
html[data-plat=pc] .weps{grid-template-columns:repeat(3,1fr)}
html[data-plat=pc] .cards{grid-template-columns:repeat(3,1fr);counter-reset:cc}
html[data-plat=pc] .card{flex-direction:column;align-items:flex-start;position:relative}
html[data-plat=pc] .card::before{counter-increment:cc;content:counter(cc);position:absolute;top:8px;right:8px;font:700 10px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
html[data-plat=pc] .wep:hover,html[data-plat=pc] .card:hover,html[data-plat=pc] .chip:hover{border-color:var(--muted);background:rgba(255,255,255,.04)}
html[data-plat=pc] .go:hover{filter:brightness(1.12)}
html[data-plat=pc] .go.ghost:hover{background:rgba(255,255,255,.05)}
html[data-plat=pc] .seg button:hover{color:var(--ink)}
html[data-plat=pc] h1{font-size:64px}
.pfrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.pfrow label{color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.pfrow input[type=range]{flex:1;max-width:260px;accent-color:var(--you)}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.kb{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

// Haze the trapper: lay mines while backing away, lead the chase over them, then fight inside the gas
const sameT=(a,b)=>a===b||isAlly(a,b);
// narrow passages (doorways, gaps between walls) found once from the nav grid
let CHOKES=null;
function buildChokes(){
  CHOKES=[];const w=(x,y)=>x>=0&&y>=0&&x<GN&&y<GN&&WALK[y*GN+x]===1;

  for(let y=1;y<GN-1;y++)for(let x=1;x<GN-1;x++){

    let ok=false;
    for(const [dx,dy] of [[1,0],[0,1]]){
      let a=0,b=0;while(a<4&&!solid(x-dx*(a+1),y-dy*(a+1)))a++;while(b<4&&!solid(x+dx*(b+1),y+dy*(b+1)))b++;
      if(a<4&&b<4&&a+b<=2&&w(x+dy*2,y+dx*2)&&w(x-dy*2,y-dx*2)){ok=true;break}

function trapBrain(a,tgt,dist){

  // 1. FIGHT: a foe is standing in my gas, so stand and shoot it
  let gasFoe=null,gd=1e9;

    if(!e.alive||sameT(e,a))continue;
    for(const g of gas){const q=Math.hypot(e.x-g.x,e.y-g.y);if(q<g.R+e.r*.5){const dd=Math.hypot(e.x-a.x,e.y-a.y);if(dd<gd){gd=dd;gasFoe=e}break}}

  if(!T.st)T.st=G.time;

  if(ed<110&&!mines.length){T.cool=G.time+3;T.st=null;return null}

      const ck=chokeNear(a,ux,uy);

// Torque the demolisher: when badly hurt, Rocket Jump away and head for health
function canFlee(a){

function update0(dt){
  if((sticks.move||sticks.aim)&&!PLAT.pc&&!phoneUI())clearSticks();
  for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];f.age+=dt;if(f.kind==='spark'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.9;f.vy*=.9}else if(f.kind==='ember'){f.x+=(f.vx+Math.sin(f.age*9+f.ph)*18)*dt;f.y+=f.vy*dt}
    else if(f.kind==='shard'||f.kind==='dropgun'){f.x+=f.vx*dt;f.y+=f.vy*dt;const fr=Math.pow(f.kind==='shard'?.06:.12,dt);f.vx*=fr;f.vy*=fr;f.rot+=f.vr*dt}
    if(f.kind==='num')f.y-=30*dt;if(f.age>(f.life||.8))G.fx.splice(i,1)}
  for(let i=G.feed.length-1;i>=0;i--){G.feed[i].age+=dt;if(G.feed[i].age>6)G.feed.splice(i,1)}
  if(!G.P)return;
  SFX.tick(dt);
  if(NET.m==='client'){netClientUpdate(dt);return}recStep(dt);
  if(G.mode==='count'){G.countdown-=dt;if(G.countdown<=0)G.mode='play';return}
  if(G.mode==='ending'){G.endT-=dt;for(const b of G.bullets){b.x+=b.vx*dt*.3;b.y+=b.vy*dt*.3}if(G.endT<=0)dropResults();return}
  if(G.mode!=='play')return;
  const P=G.P,fs=G.fighters;G.time+=dt;G.st=storm(G.time);const st=G.st;
  for(const f of fs){
    if(!f.alive)continue;
    if(f.remote)controlRemote(f,dt);else if(f===P&&!G.debug&&!NET.srv)controlPlayer(dt);else if(f.zomb)controlHorde(f,dt);else controlAI(f,dt);
    stepFighter(f,dt);
  }
  stepDeploys(dt);
  // bullets
  const bs=G.bullets;
  for(let i=bs.length-1;i>=0;i--){
    const b=bs[i];if(b.fx&&b.fx.guide&&b.expl&&b.owner.weapon==='rocket')guideRocket(b,dt);
    const sp=Math.hypot(b.vx,b.vy),ns=Math.max(1,Math.ceil(sp*dt/18)),h=dt/ns;
    let dead=false;
    for(let q=0;q<ns&&!dead;q++){
      const px=b.x,py=b.y;
      b.x+=b.vx*h;b.y+=b.vy*h;b.dist+=sp*h;

function netTogglePause(){
  if(!ov.hidden&&NET.paused){NET.paused=false;hide();return}
  if(ov.hidden&&(G.mode==='play'||G.mode==='count')){NET.paused=true;
    show(`<p class="eyebrow">Drop ${G.dropNo} · ${aliveCount()} alive</p><h2>Menu</h2><p class="lede">The match keeps running while this is open.</p>${buildHTML()}
      <button class="go ghost" data-pf="settings-pause">Settings · Controls</button>
      <div class="row"><button class="go" data-act="resume">Resume</button><button class="go ghost" data-act="menu">Leave match</button></div>`)}
}
// small status line: room, ping, host stalls
const netInfo=document.createElement('div');netInfo.id='netInfo';document.body.appendChild(netInfo);
setInterval(()=>{
  if(!NET.live||ov.hidden===false&&G.mode==='menu'){netInfo.textContent='';return}
  let s=`${NET.code} · ${NET.m==='host'?'HOST':NET.rtt+' ms'}`;
  if(NET.m==='client'&&NET.gotSnap&&performance.now()-NET.lastSnap>1500&&(G.mode==='play'||G.mode==='count'))s+=' · waiting for host…';
  if(NET.m==='host'&&document.hidden)s+=' · keep this tab in front!';
  netInfo.textContent=s;
},500);
window.__net=NET;

function update(dt){update0(dt);if(NET.m==='host')netHostTick(dt)}

if(window.__SIM){window.__SIM.api={start:netSrvStart,tick:update,recv:netRecv,botify:netBotify,rejoin:netRejoin,resync:netResync,humans:netHumans,NET,G};}else{pfInit();resize();menu();requestAnimationFrame(frame);netResume();}
})();
</script>
