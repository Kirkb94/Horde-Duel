<title>Horde Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed arena canvas, thin HUD strip on top, overlay panels for menus. Single dark world by design. */
:root{
  --void:#020403; --floor:#080d0c; --wall:#161e1c; --ink:#d9dfdb; --muted:#6c7a76;
  --you:#f0a63a; --foe:#d3283a; --storm:#a8261d; --orb:#4fc9a4;
  --panel:#070b0a; --line:#121a18;
  --display:'Oxanium','Trebuchet MS',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--display);
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--you);outline-offset:2px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;
  background:linear-gradient(var(--void),transparent)}
.side{display:flex;flex-direction:column;gap:4px;min-width:0}
.side.rt{align-items:flex-end;text-align:right}
.tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.you .tag b{color:var(--you)} .rt .tag b{color:var(--ink)}
.tag span{color:var(--muted);font-family:var(--mono);font-weight:500;letter-spacing:0}
.bar{width:100%;max-width:220px;height:8px;background:var(--line);border-radius:2px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .12s linear;background:var(--you)}
.bar.arm{height:5px;margin-bottom:2px;visibility:hidden}.bar.arm i{background:#8fb8d8}
.xp{height:3px;max-width:220px;width:100%;background:var(--line);border-radius:2px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--orb);width:0}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.alive{display:flex;align-items:baseline;gap:6px}
.alive b{font-family:var(--mono);font-size:24px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.alive span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
#stormTxt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--storm);white-space:nowrap;font-weight:700}
#pauseBtn{pointer-events:auto;background:none;border:1px solid var(--line);border-radius:4px;width:30px;height:24px;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.05em}

#dashBtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 6px);
  bottom:calc(env(safe-area-inset-bottom,0px) + min(42vh,230px));
  width:70px;height:70px;border-radius:50%;border:2px solid var(--you);background:rgba(255,181,71,.12);
  font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--you);touch-action:none;
  background-image:conic-gradient(rgba(6,9,11,.75) calc(var(--cd,0)*360deg),transparent 0)}
#dashBtn[hidden]{display:none!important}
#abBtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 88px);
  bottom:calc(env(safe-area-inset-bottom,0px) + min(42vh,230px));
  width:70px;height:70px;border-radius:50%;border:2px solid #b7a0ff;background:rgba(138,99,255,.14);
  font-weight:800;font-size:10px;letter-spacing:.08em;color:#c9b8ff;touch-action:none;
  background-image:conic-gradient(rgba(6,9,11,.75) calc(var(--cd,0)*360deg),transparent 0)}
#abBtn .cnt{display:block;font-size:22px;letter-spacing:0;line-height:1;margin-top:2px}
#abBtn[hidden]{display:none!important}
#bandBtn,#kitBtn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + min(42vh,230px) + 82px);width:62px;height:62px;border-radius:50%;border:2px solid #6be38a;background:rgba(107,227,138,.12);
  font-weight:800;font-size:8.5px;letter-spacing:.06em;color:#9af0b3;touch-action:none;background-image:conic-gradient(rgba(6,9,11,.75) calc(var(--cd,0)*360deg),transparent 0)}
#bandBtn{right:calc(max(16px,env(safe-area-inset-right,0px)) + 10px)}
#kitBtn{right:calc(max(16px,env(safe-area-inset-right,0px)) + 92px)}
#bandBtn .cnt,#kitBtn .cnt{display:block;font-size:19px;letter-spacing:0;line-height:1;margin-top:2px}
#bandBtn[hidden],#kitBtn[hidden]{display:none!important}
#bandBtn.off,#kitBtn.off{opacity:.4}
#abBtn.rdy{box-shadow:0 0 0 3px rgba(138,99,255,.25)}

/* Overlay */
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(6,9,11,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px)}
#ov[hidden],#hud[hidden]{display:none!important}
#panel{width:100%;max-width:520px;max-height:100%;overflow-y:auto;touch-action:pan-y;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 20px;
  display:flex;flex-direction:column;gap:16px}
.eyebrow{margin:0;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--storm)}
h1{margin:0;font-size:clamp(40px,11vw,60px);line-height:.9;font-weight:800;letter-spacing:-.02em;text-wrap:balance;text-transform:uppercase}
h1 em{font-style:normal;color:var(--you)}
h2{margin:0;font-size:28px;font-weight:800;text-transform:uppercase;line-height:1;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:44ch}
.group{display:flex;flex-direction:column;gap:8px}
.glabel{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;padding:10px 0;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.06em}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--foe);color:var(--void)}
.weps,.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cards{grid-template-columns:1fr}
.wep,.card{text-align:left;background:transparent;border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wep[aria-pressed="true"]{border-color:var(--you);background:rgba(255,181,71,.08)}
.wname,.cname{font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.wep[aria-pressed="true"] .wname{color:var(--you)}
.wblurb,.cdesc{font-size:12.5px;color:var(--muted);line-height:1.35}
.wstat,.ccount{font-family:var(--mono);font-size:11px;color:var(--ink);opacity:.8;font-variant-numeric:tabular-nums}
.card{flex-direction:row;align-items:center;gap:12px}
.card .cbody{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.card:active,.wep:active{transform:scale(.98)}
.card .cname{color:var(--orb)}
.card.rare .cname{color:var(--storm)}
.card.gun{border-color:rgba(255,181,71,.5);background:rgba(255,181,71,.06)}
.card.gun .cname{color:var(--you)}
.card.abil{border-color:rgba(183,160,255,.6);background:rgba(138,99,255,.09)}
.card.abil .cname,.card.abil .ctag{color:#c9b8ff}
.wrole{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wab{font-size:12px;line-height:1.35;color:#c9b8ff}
.wep[aria-pressed="true"] .wrole{color:var(--you)}
.ctag{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--you);opacity:.85}
.go{background:var(--you);color:var(--void);border:0;border-radius:4px;padding:14px;font-weight:800;font-size:16px;letter-spacing:.12em;text-transform:uppercase}
.go.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.how{font-size:13px;color:var(--muted);line-height:1.5}
.how summary{cursor:pointer;font-weight:700;color:var(--ink);letter-spacing:.06em}
.how ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.build{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.6}
.build b{color:var(--ink);font-weight:600}
.tbl{display:flex;flex-direction:column;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tr{display:grid;grid-template-columns:30px 1fr 44px 44px 44px;gap:6px;padding:7px 10px;align-items:center}
.tr+.tr{border-top:1px solid var(--line)}
.tr span:nth-child(n+3){text-align:right}
.tr.th{color:var(--muted);font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.tr.me{background:rgba(255,181,71,.1);color:var(--you)}
@media (orientation:landscape) and (max-height:500px){
  #panel{max-width:760px;padding:16px}
  .weps{grid-template-columns:repeat(3,1fr)}
  .cards{grid-template-columns:repeat(3,1fr)}
  .card{flex-direction:column;align-items:flex-start}
  h1{font-size:40px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
/* ===== PC / desktop layer ===== */
.pcOnly{display:none}
html[data-plat=pc] .pcOnly{display:list-item}
html[data-plat=pc] .phoneOnly{display:none}
#keys{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);display:none;gap:6px 14px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,980px);pointer-events:none;
  font:700 11px/1 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;opacity:.92;transition:opacity .4s}
#keys.on{display:flex}
#keys.fade{opacity:0}
#keys b{display:inline-block;min-width:20px;padding:4px 6px;margin-right:6px;text-align:center;color:var(--ink);background:rgba(8,13,12,.85);border:1px solid #2a3633;border-bottom-width:2px;border-radius:5px}
html[data-plat=pc] #hud{padding:14px 30px;gap:28px;background:linear-gradient(rgba(2,4,3,.75),transparent)}
html[data-plat=pc] .tag{font-size:13px}
html[data-plat=pc] .bar{max-width:340px;height:12px;border-radius:3px}
html[data-plat=pc] .bar.arm{height:7px}
html[data-plat=pc] .xp{max-width:340px;height:4px}
html[data-plat=pc] .alive b{font-size:34px}
html[data-plat=pc] .alive span,html[data-plat=pc] #stormTxt{font-size:12px}
html[data-plat=pc] #pauseBtn{width:38px;height:30px;font-size:12px}
html[data-plat=pc] #pauseBtn:hover{color:var(--ink);border-color:var(--muted)}
html[data-plat=pc] #dashBtn,html[data-plat=pc] #abBtn,html[data-plat=pc] #bandBtn,html[data-plat=pc] #kitBtn{
  top:auto;right:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:84px;height:62px;border-radius:9px;font-size:11px;letter-spacing:.08em;cursor:pointer;transition:transform .08s,filter .12s}
html[data-plat=pc] #bandBtn{left:calc(50% - 178px)}
html[data-plat=pc] #kitBtn{left:calc(50% - 88px)}
html[data-plat=pc] #dashBtn{left:calc(50% + 2px)}
html[data-plat=pc] #abBtn{left:calc(50% + 92px)}
html[data-plat=pc] #dashBtn:hover,html[data-plat=pc] #abBtn:hover,html[data-plat=pc] #bandBtn:hover,html[data-plat=pc] #kitBtn:hover{filter:brightness(1.25);transform:translateY(-2px)}
html[data-plat=pc] #dashBtn::before,html[data-plat=pc] #abBtn::before,html[data-plat=pc] #bandBtn::before,html[data-plat=pc] #kitBtn::before{
  content:attr(data-key);position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:2px 7px;font:700 10px var(--mono);letter-spacing:.04em;color:var(--ink);
  background:#0b100f;border:1px solid #2a3633;border-bottom-width:2px;border-radius:5px;white-space:nowrap}
html[data-plat=pc] #panel{max-width:760px;padding:30px 32px;gap:18px}
html[data-plat=pc] .weps{grid-template-columns:repeat(3,1fr)}
html[data-plat=pc] .cards{grid-template-columns:repeat(3,1fr);counter-reset:cc}
html[data-plat=pc] .card{flex-direction:column;align-items:flex-start;position:relative}
html[data-plat=pc] .card::before{counter-increment:cc;content:counter(cc);position:absolute;top:8px;right:8px;font:700 10px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
html[data-plat=pc] .wep:hover,html[data-plat=pc] .card:hover,html[data-plat=pc] .chip:hover{border-color:var(--muted);background:rgba(255,255,255,.04)}
html[data-plat=pc] .go:hover{filter:brightness(1.12)}
html[data-plat=pc] .go.ghost:hover{background:rgba(255,255,255,.05)}
html[data-plat=pc] .seg button:hover{color:var(--ink)}
html[data-plat=pc] h1{font-size:64px}
.pfrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.pfrow label{color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.pfrow input[type=range]{flex:1;max-width:260px;accent-color:var(--you)}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.kb{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kb b{font-family:var(--mono);color:var(--ink);background:#0b100f;border:1px solid #2a3633;border-bottom-width:2px;border-radius:5px;padding:2px 8px;min-width:30px;text-align:center}
.kb.wait{border-color:var(--you);color:var(--you)}.kb.wait b{color:var(--you);border-color:var(--you)}
@media (max-width:560px){.keys{grid-template-columns:1fr}}
.nin{width:100%;box-sizing:border-box;background:var(--void);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:12px;font:600 16px var(--mono)}
.nin:focus{outline:2px solid var(--you);outline-offset:0}
.nrow{display:flex;gap:8px}.nrow .nin{flex:1}.nrow .go{flex:0 0 auto;padding:12px 22px}
#netInfo{position:fixed;top:4px;left:50%;transform:translateX(-50%);font:600 11px var(--mono);color:var(--muted);z-index:9;pointer-events:none;letter-spacing:.06em;text-shadow:0 1px 2px #000}
</style>

<canvas id="cv" aria-label="Arena"></canvas>

<div id="hud" hidden>
  <div class="side you">
    <div class="tag"><b>You</b><span id="pLv">Lv 1</span></div>
    <div class="bar arm"><i id="pAr"></i></div>
    <div class="bar"><i id="pHp"></i></div>
    <div class="xp"><i id="pXp"></i></div>
    <div class="tag"><span id="pWep">&nbsp;</span></div>
    <div class="tag"><span id="pAb">&nbsp;</span></div>
  </div>
  <div class="mid">
    <div class="alive"><b id="aliveN">16</b><span>alive</span></div>
    <div id="stormTxt"></div>
    <button id="pauseBtn" aria-label="Pause">II</button>
  </div>
  <div class="side rt">
    <div class="tag"><b id="dropTxt">Drop 1</b></div>
    <div class="tag"><span id="killTxt">0 kills</span></div>
    <div class="tag"><span id="winTxt">0 wins</span></div>
  </div>
</div>
<button id="dashBtn" hidden aria-label="Dash">DASH</button>
<button id="abBtn" hidden aria-label="Ability">ABILITY</button>
<button id="bandBtn" class="hb" hidden aria-label="Bandage">BANDAGE</button>
<button id="kitBtn" class="hb" hidden aria-label="Med kit">MED KIT</button>

<div id="keys"></div>
<div id="ov"><div id="panel"></div></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const css = getComputedStyle(document.documentElement);
const C = n => css.getPropertyValue(n).trim();
const COL = {void:C('--void'),floor:C('--floor'),wall:C('--wall'),ink:C('--ink'),muted:C('--muted'),you:C('--you'),foe:C('--foe'),storm:C('--storm'),orb:C('--orb'),line:C('--line')};
function rgba(hex,a){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

const FIRE='#ff9a3c';
const TAU=Math.PI*2, rad=d=>d*Math.PI/180, clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a);
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const turnToward=(a,b,m)=>{const d=angDiff(a,b);return a+clamp(d,-m,m)};
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
const cap=s=>s[0].toUpperCase()+s.slice(1);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ---------- Tuning ----------
let N_FIGHT=16, R0=2900;const WIN_DROPS=3, WORLD=4000, MID=WORLD/2;
const mhp=f=>f.zomb?f.zhp:Math.round(CHARS[f.weapon].hpMax*(1+.2*((f.st&&f.st.fx.maxhp)||0))), SPEED=172.5, DASH_SPEED=720, DASH_T=0.16, DASH_CD=1.6, INV_T=0.26;
const VIEW_R=560, FOV=rad(100), NEAR=90, STICK_R=56;
const PTS=[10,7,5,4,3,3,2,2,1,1,1,0,0,0,0,0];
const NAMES=['Vex','Rook','Nyx','Jett','Orin','Kade','Mara','Sol','Tarn','Pike','Zed','Iris','Bram','Lux','Dax'];

const WEAPONS={
  pistol:{name:'Pistol',pattern:'straight',damage:13,rate:3.8,n:1,spread:0,jitter:1,speed:900,life:0.7,spin:0,pierce:0,clip:12,reload:1.1,blurb:'Steady and reliable at any range'},
  revolver:{name:'Revolver',pattern:'straight',damage:27,rate:2,n:1,spread:0,jitter:.5,speed:1000,life:0.6,spin:0,pierce:0,clip:6,reload:2,blurb:'Heavy hitter, six rounds then a slow reload'},
  smg:{name:'SMG',pattern:'straight',damage:7,rate:11,n:1,spread:0,jitter:5,speed:850,life:0.55,spin:0,pierce:0,clip:36,reload:1.6,blurb:'Bullet hose, shreds up close'},
  rifle:{name:'Rifle',pattern:'straight',damage:9,rate:6,n:1,spread:0,jitter:0,speed:950,life:0.75,spin:0,pierce:0,clip:24,reload:1.5,blurb:'Fast, accurate, low damage per hit'},
  shotgun:{name:'Shotgun',pattern:'straight',damage:7,rate:1.4,n:7,spread:22,jitter:3,speed:900,life:0.4,spin:0,pierce:0,clip:6,reload:2,blurb:'Seven pellets per blast, deadly up close'},
  sniper:{name:'Sniper',pattern:'straight',damage:34,rate:1.1,n:1,spread:0,jitter:0,speed:1500,life:0.45,spin:0,pierce:0,clip:5,reload:2.2,blurb:'One heavy shot, longest reach'},
  rocket:{name:'Rocket Launcher',pattern:'straight',damage:40,rate:.85,n:1,spread:0,jitter:.5,speed:640,life:1.1,spin:0,pierce:0,clip:4,reload:2.6,blurb:'Slow rockets with a big blast'},
  sword:{name:'Sword',pattern:'straight',damage:26,rate:2.6,n:1,spread:0,jitter:0,speed:1000,life:.06,spin:0,pierce:0,clip:999,reload:.1,blurb:'Wide arc slash, close range'}
};
const WKEYS=Object.keys(WEAPONS);
const CHARS={
  pistol:{spd:1.0,hpMax:140,name:'Wren',role:'Sentry',ab:'Sentry Turret',btn:'TURRET',cd:16,desc:'Drops an auto-firing turret that guards the spot for 14s'},
  revolver:{spd:0.96,hpMax:130,name:'Cinder',role:'Arsonist',ab:'Molotov',btn:'MOLOTOV',cd:13,desc:'Tap anywhere in range to lob a fire bomb there. The flames burn anyone standing in them'},

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genMap(){

  const vw=(x,y,len,door)=>{if(!door){add(x,y,T,len);return}const dw=104,d0=clamp(len/2-dw/2+R(-len*.12,len*.12),20,len-dw-20);add(x,y,T,d0);add(x,y+d0+dw,T,len-d0-dw)};
  const room=(cx,cy,s)=>{const d=[rr()<.6,rr()<.6,rr()<.6,rr()<.6];if(!d.some(Boolean))d[Math.floor(rr()*4)]=true;
    hw(cx-s/2,cy-s/2,s,d[0]);hw(cx-s/2,cy+s/2-T,s,d[1]);vw(cx-s/2,cy-s/2,s,d[2]);vw(cx+s/2-T,cy-s/2,s,d[3])};

const CS=50,GN=WORLD/CS,WALK=new Uint8Array(GN*GN);

function nearestWalk(x,y){
  const cx=clamp(Math.floor(x/CS),0,GN-1),cy=clamp(Math.floor(y/CS),0,GN-1);
  if(WALK[cy*GN+cx])return cy*GN+cx;
  for(let r=1;r<12;r++){let best=-1,bd=1e9;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){

      const X=cx+dx,Y=cy+dy;if(X<0||Y<0||X>=GN||Y>=GN||!WALK[Y*GN+X])continue;

}

  seen[s0]=stamp;gS[s0]=0;came[s0]=-1;hpush(s0,h(s0));

  while(heapI.length&&it++<9000){
    const c=hpop();if(done[c]===stamp)continue;done[c]=stamp;
    if(c===t0){found=true;break}
    const cx=c%GN,cy=(c/GN)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;const X=cx+dx,Y=cy+dy;if(X<0||Y<0||X>=GN||Y>=GN)continue;
      const n=Y*GN+X;if(!WALK[n])continue;

      const ng=gS[c]+(dx&&dy?1.4142:1);

  const ua=/Android|iPhone|iPad|iPod|Mobile|CriOS|FxiOS|Silk/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  return !(ua||mq('(pointer:coarse)')||mq('(hover:none)'));
}

function pfCaptureKey(e){
  const c=e.code,a=PF.rebind;PF.rebind=null;
  if(c!=='Escape'){
    for(const o in BIND){if(o!==a)BIND[o]=BIND[o].filter(x=>x!==c);if(!BIND[o].length)BIND[o]=BIND_DEF[o].filter(x=>x!==c).slice(0,1)}
    for(const o in ALT)ALT[o]=ALT[o].filter(x=>x!==c);
    BIND[a]=[c];pfSave()}
  pfSettings();
}
function kbAction(e){
  const c=e.code;
  if(PF.rebind){e.preventDefault();pfCaptureKey(e);return true}
  if(e.altKey&&c==='Enter'){pfFullscreen();e.preventDefault();return true}
  if(PF.open){if(c==='Escape'){pfBack();e.preventDefault()}return true}
  const has=a=>BIND[a].includes(c)||(ALT[a]||[]).includes(c);
  if(!ov.hidden){
    // menu screens: Enter confirms, number keys pick cards
    if(c==='Enter'||c==='NumpadEnter'){const b=panel.querySelector('.go:not(.ghost):not(:disabled)');if(b){b.click();e.preventDefault();return true}}
    if(/^Digit[1-9]$/.test(c)){const it=panel.querySelectorAll('.cards .card:not(:disabled)')[+c.slice(5)-1];if(it){it.click();e.preventDefault();return true}}
    if((G.mode==='paused'||NET.paused)&&has('pause'))togglePause();
    return false;
  }
  if(G.spectating&&G.mode==='play'&&!G.debug){if(c==='ArrowLeft'){pickSpec(-1);return true}if(c==='ArrowRight'){pickSpec(1);return true}}
  if(has('band'))healQueued='band';
  if(has('kit'))healQueued='kit';
  if(has('dash')){dashQueued=true;e.preventDefault()}
  if(has('ability'))abQueued=true;
  if(has('pause'))togglePause();
  if(has('hints')&&!e.repeat){PLAT.hints=!PLAT.hints;pfSave()}
  return false;
}

function pfBack(){

function pfBindPanel(){

function fireWeapon(f,echo){

// flow fields: one breadth-first distance map per goal, shared by every zombie heading there
function flowField(gx,gy){

      d[n]=d[c]+1;q[t++]=n}}

function flowFor(t){

    G.hfb++;e={t:G.time,x:gx,y:gy,d:flowField(gx,gy)};m.set(key,e)}

function dropResults(){

function update0(dt){
  for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];f.age+=dt;if(f.kind==='spark'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.9;f.vy*=.9}else if(f.kind==='ember'){f.x+=(f.vx+Math.sin(f.age*9+f.ph)*18)*dt;f.y+=f.vy*dt}
    else if(f.kind==='shard'||f.kind==='dropgun'){f.x+=f.vx*dt;f.y+=f.vy*dt;const fr=Math.pow(f.kind==='shard'?.06:.12,dt);f.vx*=fr;f.vy*=fr;f.rot+=f.vr*dt}
    if(f.kind==='num')f.y-=30*dt;if(f.age>(f.life||.8))G.fx.splice(i,1)}
  for(let i=G.feed.length-1;i>=0;i--){G.feed[i].age+=dt;if(G.feed[i].age>6)G.feed.splice(i,1)}
  if(!G.P)return;
  SFX.tick(dt);
  if(NET.m==='client'){netClientUpdate(dt);return}
  if(G.mode==='count'){G.countdown-=dt;if(G.countdown<=0)G.mode='play';return}
  if(G.mode==='ending'){G.endT-=dt;for(const b of G.bullets){b.x+=b.vx*dt*.3;b.y+=b.vy*dt*.3}if(G.endT<=0)dropResults();return}
  if(G.mode!=='play')return;
  const P=G.P,fs=G.fighters;G.time+=dt;G.st=storm(G.time);const st=G.st;
  for(const f of fs){
    if(!f.alive)continue;
    if(f.remote)controlRemote(f,dt);else if(f===P&&!G.debug&&!NET.srv)controlPlayer(dt);else if(f.zomb)controlHorde(f,dt);else controlAI(f,dt);
    stepFighter(f,dt);
  }
  stepDeploys(dt);
  // bullets
  const bs=G.bullets;
  for(let i=bs.length-1;i>=0;i--){
    const b=bs[i];if(b.fx&&b.fx.guide&&b.expl&&b.owner.weapon==='rocket')guideRocket(b,dt);
    const sp=Math.hypot(b.vx,b.vy),ns=Math.max(1,Math.ceil(sp*dt/18)),h=dt/ns;
    let dead=false;
    for(let q=0;q<ns&&!dead;q++){
      const px=b.x,py=b.y;
      b.x+=b.vx*h;b.y+=b.vy*h;b.dist+=sp*h;
      if(b.x<0||b.y<0||b.x>WORLD||b.y>WORLD){dead=true;break}
      for(let k=0;k<RECTS.length;k++){const r=RECTS[k];
        if(b.x>r.x&&b.x<r.x+r.w&&b.y>r.y&&b.y<r.y+r.h){
          if(b.passed.includes(k))continue;
          if(b.walls>0){b.walls--;b.passed.push(k)}
          else if(b.bounce>0){
            b.bounce--;if(px<=r.x||px>=r.x+r.w)b.vx=-b.vx;else b.vy=-b.vy;
            b.x=px;b.y=py;if(near(b.x,b.y))burst(b.x,b.y,b.owner.isAI?COL.foe:COL.you,4,120);
          }else{dead=true;if(b.expl){b.x=px;b.y=py}if(near(b.x,b.y))burst(px,py,b.owner.isAI?COL.foe:COL.you,4,120);break}
        }
      }
      if(dead)break;
      for(const d of G.deploys){
        if(d.owner===b.owner||isAlly(d.owner,b.owner))continue;
        if(d.kind==='cover'){
          if(b.cv.includes(d))continue;
          const rx=b.x-d.x,ry=b.y-d.y,ly=rx*d.nx+ry*d.ny,lx=-rx*d.ny+ry*d.nx;
          if(Math.abs(lx)<d.len/2+b.r&&Math.abs(ly)<7+b.r){
            b.cv.push(d);
            if(b.vx*d.nx+b.vy*d.ny<0&&Math.random()<d.chance){dead=true;d.hp-=b.dmg;d.flash=.1;if(d.hp<=0){d.life=0;if(near(d.x,d.y))burst(d.x,d.y,COL.ink,20,300)}if(near(b.x,b.y))burst(b.x,b.y,COL.ink,5,140);break}
          }
        }else if(d.kind==='barrier'){
          const sx=b.x-d.x,sy=b.y-d.y,dd=Math.hypot(sx,sy);
          if(dd<=d.R+b.r+3&&dd>=d.R-18&&b.vx*sx+b.vy*sy<0&&Math.abs(angDiff(d.dir,Math.atan2(sy,sx)))<=Math.PI/2){
            d.hp-=b.dmg;d.flash=.12;if(near(b.x,b.y))burst(b.x,b.y,'#7fd7ff',6,170);dead=true;
            if(d.hp<=0){d.life=0;if(near(d.x,d.y))burst(d.x,d.y,'#7fd7ff',18,300);G.fx.push({kind:'ring',x:d.x,y:d.y,age:0,life:.35,r:34,col:'#7fd7ff'});
              const k=d.owner.st.fx.shock;if(k)explode({x:d.x,y:d.y,expl:120,dmg:35*(1+.5*(k-1)),owner:d.owner})}
            break;
          }
        }else if(d.kind==='turret'&&!b.expl){
          if(Math.hypot(b.x-d.x,b.y-d.y)<d.r+b.r){d.hp-=b.dmg;if(near(b.x,b.y))burst(b.x,b.y,COL.ink,4,140);if(b.pf>0){b.pf--;b.dmg*=.85}else dead=true;break}
        }
      }
      for(let k=0;k<fs.length&&!dead;k++){
        const t=fs[k];if(!t.alive||t.shield<=0||t===b.owner||b.expl||isAlly(b.owner,t))continue;
        const sx=b.x-t.x,sy=b.y-t.y,dd=Math.hypot(sx,sy);
        if(dd>38+b.r+3||dd<38-18)continue;
        if(b.vx*sx+b.vy*sy>=0)continue;
        if(Math.abs(angDiff(t.shieldDir,Math.atan2(sy,sx)))>Math.PI/2)continue;
        t.shield-=b.dmg;t.shF=.12;if(near(b.x,b.y))burst(b.x,b.y,'#7fd7ff',6,170);
        if(t.shield<=0){t.shield=0;t.shieldT=0;shieldBreak(t)}
        dead=true;
      }
      if(dead)break;
      for(let k=0;k<fs.length;k++){
        const t=fs[k];if(!t.alive||t===b.owner||t.inv>0||b.hit.includes(t.id)||isAlly(b.owner,t))continue;
        const dx=t.x-b.x,dy=t.y-b.y,rr=t.r+b.r;
        if(dx*dx+dy*dy<rr*rr){
          if(t.defl>0&&!b.expl&&t.weapon==='sword'){
            t.defl--;t.parryT=.28;t.swordOut=.9;const o=b.owner,a=Math.atan2(o.y-t.y,o.x-t.x),v=Math.hypot(b.vx,b.vy);
            b.vx=Math.cos(a)*v;b.vy=Math.sin(a)*v;b.owner=t;b.hit=[];b.life=Math.max(b.life,.35);b.dist=0;b.x=t.x+Math.cos(a)*(t.r+b.r+3);b.y=t.y+Math.sin(a)*(t.r+b.r+3);
            G.fx.push({kind:'ring',x:t.x,y:t.y,age:0,life:.25,r:30,col:CPAL.sword.acc});if(near(t.x,t.y)){burst(t.x,t.y,'#ffffff',10,280);burst(t.x+Math.cos(a)*22,t.y+Math.sin(a)*22,CPAL.sword.acc,8,200)}
            break;
          }
          if(b.expl){dead=true;break}
          hitFighter(b,t);
          if(b.pf>0){b.pf--;b.hit.push(t.id);b.dmg*=.85}else dead=true;
          break;
        }
      }
    }
    b.life-=dt;if(b.life<=0)dead=true;
    if(dead){if(b.expl)explode(b);bs[i]=bs[bs.length-1];bs.pop()}
  }
  // orbs
  G.orbT-=dt;
  if(G.orbT<=0){G.orbT=1.2;if(G.orbs.reduce((n,o)=>n+(o.item?0:1),0)<Math.max(6,Math.round(40*G.os)))spawnOrb(true)}
  G.armT=(G.armT||0)-dt;if(G.armT<=0){G.armT=9;if(G.orbs.reduce((n,o)=>n+(o.item==='armor'?1:0),0)<Math.max(2,Math.round(12*G.os)))spawnOrb(true,'armor')}
  G.itemT=(G.itemT||0)-dt;
  if(G.itemT<=0){G.itemT=6;const nb=G.orbs.reduce((n,o)=>n+(o.item&&o.item!=='armor'?1:0),0);if(nb<Math.max(4,Math.round(26*G.os)))spawnOrb(true,Math.random()<.22?'kit':'band')}
  for(let i=G.orbs.length-1;i>=0;i--){const o=G.orbs[i];o.t+=dt;
    for(const f of fs){if(!f.alive||f.zomb)continue;
      if(Math.hypot(f.x-o.x,f.y-o.y)<f.r+14){
        if(o.item==='armor'){if(f.armor>0)continue;f.armor=50;SFX.pickup('armor',o.x,o.y);if(near(o.x,o.y))burst(o.x,o.y,'#8fb8d8',12,200);o.gone=true;G.orbs.splice(i,1);break}
        if(o.item){if(f[o.item]>=HEAL[o.item].cap)continue;f[o.item]++;SFX.pickup('item',o.x,o.y);if(near(o.x,o.y))burst(o.x,o.y,'#6be38a',8,160);o.gone=true;G.orbs.splice(i,1);break}

      else if(n==='zdie'){SFX.zdie(e.x,e.y);netShards(e.x,e.y,['#5f8a3f','#8c1f2b'],8);G.fx.push({kind:'splat',x:e.x,y:e.y,r:rnd(20,30),a:Math.random()*TAU,age:0,life:9})}
      else if(SFX[n])SFX[n](e.x,e.y,e.a);
      break}
    case'x':{const o=Object.assign({age:0},e);delete o.e;o.kind=o.k;delete o.k;
      if(o.kind==='slash'&&o.own!=null)o.own=fById(o.own);
      if(o.kind==='death')o.col=o.who===NET.my?COL.you:COL.foe;
      if(o.kind==='splat')break;
      G.fx.push(o);break}
    case'f':feedAdd(e.m,!!(P&&e.m.indexOf(P.name)>=0));break;
    case'n':{const t=fById(e.t);if(!t)break;const mine=e.t===NET.my;addNum(t,e.v,mine?COL.foe:COL.you);break}
    case'k':{const f=fById(e.id);if(!f)break;f.alive=false;f.place=e.pl;
      if(e.id===NET.my){G.spectating=true;G.pOut=true;G.elimT=1.7;try{navigator.vibrate&&navigator.vibrate([40,40,80])}catch(_){}}break}
  }
}
const DECAY=['muzzle','swingT','hitFlash','parryT','rdT','inv','dashCD','healT','shF','hurtT','cloakT','burnT','slowT','markT','dashT','reloadT','swingT','pingT'];
function netClientUpdate(dt){
  const P=G.P,fs=G.fighters;
  if(G.mode==='count'){G.countdown-=dt;if(G.countdown<=0&&NET.gotSnap)G.mode='play'}
  else if(G.mode==='play'||G.mode==='ending')G.time+=dt;
  for(let i=0;i<fs.length;i++){const f=fs[i];
    f.t+=dt;for(const k of DECAY)if(f[k]>0)f[k]=Math.max(0,f[k]-dt);
    if(f.zomb)f.pulse+=dt;
    if(f===P||!f.alive||f.tx===undefined)continue;
    const dx=f.tx-f.x,dy=f.ty-f.y;
    if(dx*dx+dy*dy>40000){f.x=f.tx;f.y=f.ty}else{const k=Math.min(1,dt*14);f.x+=dx*k;f.y+=dy*k}
    if(f.tf!==undefined)f.facing=turnToward(f.facing,f.tf,(f.zomb?6:18)*dt);
    if(f.dashT>0&&!f.zomb&&Math.random()<.9)G.fx.push({kind:'ghost',x:f.x,y:f.y,age:0,life:.18,col:COL.foe});
  }
  for(const b of G.bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(const o of G.orbs)o.t+=dt;
  if(G.mode==='ending')return;
  // own fighter: input, prediction
  if(P.alive&&(G.mode==='play'||G.mode==='count')){
    controlNet(dt);
    if(G.mode==='play'){
      if(P.jumpT>0||(P.dashT>0&&P.dashSp>800)){const k=Math.min(1,dt*14);P.x+=(P.tx-P.x)*k;P.y+=(P.ty-P.y)*k}
      else{
        let vx,vy;
        if(P.dashT>0){vx=Math.cos(P.dashDir)*P.dashSp;vy=Math.sin(P.dashDir)*P.dashSp;if(Math.random()<.9)G.fx.push({kind:'ghost',x:P.x,y:P.y,age:0,life:.18,col:COL.you})}
        else{const fx=P.st.fx,sp=SPEED*CHARS[P.weapon].spd*(1+.08*(fx.fleet||0))*(P.healT>0?.5:1)*(P.slowT>0?1-P.slowAmt:1);vx=P.mv.x*sp;vy=P.mv.y*sp}
        P.x+=vx*dt;P.y+=vy*dt;collide(P);
      }
    }
  }else if(!P.alive){P.mv={x:0,y:0};P.wantFire=false}
  if(G.pOut&&G.elimT>0){G.elimT-=dt;if(G.elimT<=0)openElim()}
  if(performance.now()-NET.lastIn>=33||NET.acts.length){NET.lastIn=performance.now();netSendInput()}
}
function controlNet(dt){
  const p=G.P;let mx=0,my=0,fire=false;
  if(ov.hidden&&G.mode==='play'){
    const ms=stickVec(sticks.move);mx=ms.x;my=ms.y;
    if(kd('up'))my-=1;if(kd('down'))my+=1;if(kd('left'))mx-=1;if(kd('right'))mx+=1;
    const mm=Math.hypot(mx,my);if(mm>1){mx/=mm;my/=mm}
    const as=stickVec(sticks.aim);
    if(sticks.aim&&as.m>0.22){p.facing=Math.atan2(as.y,as.x);fire=true}
    else if(G.mouseMode){const z=zoom();const wx=(mouse.x-innerWidth/2)/z+G.cam.x,wy=(mouse.y-innerHeight/2)/z+G.cam.y;p.facing=Math.atan2(wy-p.y,wx-p.x);fire=mouse.down}
    else if(mm>0.15)p.facing=turnToward(p.facing,Math.atan2(my,mx),12*dt);
    if(dashQueued){dashQueued=false;
      if(p.dashCD<=0&&p.dashT<=0&&p.jumpT<=0){p.dashSp=DASH_SPEED;p.dashDir=Math.hypot(mx,my)>.1?Math.atan2(my,mx):p.facing;p.dashT=DASH_T;p.inv=INV_T;p.dashCD=DASH_CD;p.healT=0;p.healKind=null;NET.acts.push(['d',q2(mx),q2(my)])}}
    if(G.molo>0){G.molo-=dt;if(G.molo<=0)G.molo=0}
    if(healQueued){const k=healQueued;healQueued=null;NET.acts.push(['h',k==='band'?1:2])}
    if(abQueued){abQueued=false;
      if(p.weapon==='revolver'){if(G.molo>0)G.molo=0;else if((p.abCD<=0||p.abCh>0)&&p.dashT<=0)G.molo=5}
      else NET.acts.push(['a'])}
    if(keys.has('KeyR')&&performance.now()-NET.keyR>400){NET.keyR=performance.now();NET.acts.push(['r'])}
  }else{dashQueued=false;abQueued=false;healQueued=null}
  p.mv={x:mx,y:my};p.wantFire=fire;
}
function netSendInput(){
  const P=G.P;if(!P||NET.m!=='client')return;
  netRel(NET.hostPid,{k:'i',mx:q2(P.mv.x),my:q2(P.mv.y),f:q2(P.facing),fr:P.wantFire?1:0,a:NET.acts,sv:(G.spec&&!P.alive)?G.spec.id:-1});
  NET.acts=[];
}
function netClientResults(d){
  const fs=G.fighters.slice(0,N_FIGHT),P=G.P;
  d.st.forEach((s,i)=>{const f=fs[i];f.wins=s[0];f.pts=s[1];f.kills=s[2];f.place=s[3];f.dropKills=s[4];f.level=s[5]});
  G.winner=fs[d.w];G.mode=d.fin?'over':'between';G.pickCtx='between';NET.pk=d.pk;NET.tot=d.pk;NET.picks=[];G.pending=0;
  if(d.fin){
    showHUD(false);const champ=standings()[0];
    show(`<p class="eyebrow">Match over · ${cap(G.diff)} bots</p><h2>${champ===P?'You win the match':esc(champ.name)+' wins the match'}</h2>
      <p class="lede">You placed #${P.place} in the last drop.</p>${standingsHTML(8)}${buildHTML()}
      <p class="lede">The host can start another match from the lobby.</p><div class="row"><button class="go ghost" data-act="menu">Leave</button></div>`);
    return;
  }
  netShowOffers(true);
}
function netShowOffers(first){
  const P=G.P,o=offers(P,3);
  if(!o.length){netClientDone();return}
  const won=G.winner===P;
  show(`<p class="eyebrow">Drop ${G.dropNo} complete</p><h2>${first?(won?'You won the drop':'Drop over'):'Pick another upgrade'}</h2>
    ${first?`<p class="lede">${won?'Last one standing':'You placed #'+P.place+' of '+N_FIGHT+' with '+P.dropKills+' kill'+(P.dropKills===1?'':'s')}. First to ${WIN_DROPS} drop wins takes the match.</p>${standingsHTML(5)}`:''}
    <p class="lede">Upgrade ${NET.tot-NET.pk+1} of ${NET.tot}. Pick yours.</p>${cardsHTML(o,1)}`);
}
function netClientPick(v,m){
  const P=G.P;if(v){applyUpgrade(P,v,m);NET.picks.push([v,m])}
  NET.pk--;if(NET.pk>0)netShowOffers(false);else netClientDone();
}
function netClientDone(){
  netRel(NET.hostPid,{k:'ready',picks:NET.picks});
  show(`<p class="eyebrow">Drop ${G.dropNo} complete</p><h2>Waiting for players…</h2><p class="lede">The next drop starts as soon as everyone has picked.</p>`);
}
function netTogglePause(){
  if(!ov.hidden&&NET.paused){NET.paused=false;hide();return}
  if(ov.hidden&&(G.mode==='play'||G.mode==='count')){NET.paused=true;
    show(`<p class="eyebrow">Drop ${G.dropNo} · ${aliveCount()} alive</p><h2>Menu</h2><p class="lede">The match keeps running while this is open.</p>${buildHTML()}
      <button class="go ghost" data-pf="settings-pause">Settings · Controls</button>
      <div class="row"><button class="go" data-act="resume">Resume</button><button class="go ghost" data-act="menu">Leave match</button></div>`)}
}
// small status line: room, ping, host stalls
const netInfo=document.createElement('div');netInfo.id='netInfo';document.body.appendChild(netInfo);
setInterval(()=>{
  if(!NET.live||ov.hidden===false&&G.mode==='menu'){netInfo.textContent='';return}
  let s=`${NET.code} · ${NET.m==='host'?'HOST':NET.rtt+' ms'}`;
  if(NET.m==='client'&&NET.gotSnap&&performance.now()-NET.lastSnap>1500&&(G.mode==='play'||G.mode==='count'))s+=' · waiting for host…';
  if(NET.m==='host'&&document.hidden)s+=' · keep this tab in front!';
  netInfo.textContent=s;
},500);
window.__net=NET;

function update(dt){update0(dt);if(NET.m==='host')netHostTick(dt)}

if(window.__SIM){window.__SIM.api={start:netSrvStart,tick:update,recv:netRecv,botify:netBotify,humans:netHumans,NET,G};}else{pfInit();resize();menu();requestAnimationFrame(frame);}
})();
</script>
